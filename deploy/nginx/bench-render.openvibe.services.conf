## ════════════════════════════════════════════════════════════════════════════════════════════════════════════════
## bench-render.openvibe.services — Nginx configuration (REFERENCE)
##
## Deployed to /etc/nginx/sites-available/bench-render.openvibe.services.conf (ov-vhost-install) — keep them in sync and
## reload nginx after changing it. The render origin (server/bench/render.js): the trusted wrapper (/render/w/:id), the
## model's own document (/render/e/:id) and the vendored libraries (/vendor/), from the same Node app (port 5230) on a
## separate origin that never sees a cookie or a session. Everything else answers 404. GET and HEAD only.
## The certificate is the *.openvibe.services wildcard.
## ════════════════════════════════════════════════════════════════════════════════════════════════════════════════
server {
    listen 80;
    listen [::]:80;
    server_name bench-render.openvibe.services;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://bench-render.openvibe.services$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name bench-render.openvibe.services;

    ssl_certificate     /etc/letsencrypt/live/openvibe.services/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.services/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/bench-render.openvibe.services.access.log;
    error_log  /var/log/nginx/bench-render.openvibe.services.error.log;

    client_max_body_size 1k;
    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript image/svg+xml text/plain;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header CF-Connecting-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # No credentials in either direction: this origin never carries a session.
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_hide_header Set-Cookie;

    location ~ ^/(render/[we]/|vendor/) {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:5230;
    }
    location / { return 404; }
}
