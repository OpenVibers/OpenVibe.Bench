## ═══════════════════════════════════════════════════════════════
## bench.openvibe.services — Nginx configuration (REFERENCE)
##
## Deployed to /etc/nginx/sites-available/bench.openvibe.services.conf (ov-vhost-install) — keep them in sync and reload
## nginx after changing it. The Node app (port 5230, systemd unit openvibe-bench) renders every page and serves
## the API; nginx terminates TLS, redirects www → apex, rate-limits sign-in, the API and the forms, and compresses
## text.
##
## No proxy_cache: the app decides cacheability per response (public for the public pages and entries; private,
## no-store for anything drawn for a signed-in person). Never log request bodies here.
## ═══════════════════════════════════════════════════════════════

limit_req_zone $binary_remote_addr zone=bench_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=bench_api:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=bench_forms:10m rate=1r/s;

server {
    listen 80;
    listen [::]:80;
    server_name bench.openvibe.services;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://bench.openvibe.services$request_uri; }
}


server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name bench.openvibe.services;

    ssl_certificate     /etc/letsencrypt/live/openvibe.services/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.services/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/bench.openvibe.services.access.log;
    error_log  /var/log/nginx/bench.openvibe.services.error.log;

    # The API's JSON body cap is 64 KB; leave room for the headers.
    client_max_body_size 128k;

    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json application/problem+json image/svg+xml text/plain application/xml;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header CF-Connecting-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ── Network SSO session endpoints ───────────────────────
    # The navbar's session probe runs on every page view: it gets the API's budget, not sign-in's.
    location = /auth/me {
        limit_req zone=bench_api burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:5230;
    }

    location /auth/ {
        limit_req zone=bench_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:5230;
    }

    # ── API ─────────────────────────────────────────────────
    location /api/ {
        limit_req zone=bench_api burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:5230;
    }

    # ── Forms and other writes: the vote, the caption generator, the report ──
    location = /mcp {
        limit_except POST { deny all; }
        limit_req zone=bench_api burst=20 nodelay;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:5230;
    }

    location ~ ^/(evals|rounds/[A-Za-z0-9_-]+/vote)$ {
        limit_req zone=bench_forms burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:5230;
    }

    # ── Prometheus metrics: host-local scrapers only (http://127.0.0.1:5230/metrics) ──
    location ~* ^/metrics(/|$) { return 404; }

    # ── OpenVibe.Events' account delivery route: loopback only (POST /internal/events) ──
    # Events posts to http://127.0.0.1:5230/internal/events directly. Never proxied from outside (ADR-033).
    location ~* ^/internal(/|$) { return 404; }

    # ── Pages, docs, robots.txt, sitemap, static assets ─────
    location / {
        proxy_pass http://127.0.0.1:5230;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
