## ═══════════════════════════════════════════════════════════════
## bench.openvibe.services — Nginx Configuration (REFERENCE)
##
## Deployed to /etc/nginx/sites-available/bench.openvibe.services.conf — keep them in sync, and reload
## nginx after changing it. It uses the *.openvibe.services certificate the host already holds
## (/etc/letsencrypt/live/openvibe.services/), the same wildcard AI uses.
##
## The Node service (port 5230, systemd unit openvibe-bench) serves:
##   /             the product home for a browser
##   /docs         the Bench API docs (server-rendered, no sign-in)
##   /shared/*     the home's OpenVibe Frame files; /robots.txt, /sitemap.xml, /llms.txt, /llms-full.txt
##   /api/health, /api/ready
##   /auth/*       Network sign-in (redirect URI https://bench.openvibe.services/auth/callback, OAuth
##                 client `bench`)
##   /mcp          the Bench MCP endpoint (POST)
##   /api/v1/*     the service API: service-to-service with first-party service tokens. Services on this
##                 host call 127.0.0.1:5230 directly, so the public vhost refuses it.
##   /metrics      Prometheus text, answered only to direct loopback callers (never proxied)
## ═══════════════════════════════════════════════════════════════

server {
    listen 80;
    listen [::]:80;
    server_name bench.openvibe.services;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://bench.openvibe.services$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name bench.openvibe.services;

    ssl_certificate     /etc/letsencrypt/live/openvibe.services/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.services/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/bench.openvibe.services.access.log;
    error_log  /var/log/nginx/bench.openvibe.services.error.log;

    # Task prompts, entry payloads and MCP bodies are the only request bodies Bench accepts.
    client_max_body_size 64k;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location = /api/health { proxy_pass http://127.0.0.1:5230; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header CF-Connecting-IP $remote_addr; }
    location = /api/ready  { proxy_pass http://127.0.0.1:5230; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header CF-Connecting-IP $remote_addr; }

    # Metrics are for host-local scrapers only (http://127.0.0.1:5230/metrics).
    location ~* ^/metrics(/|$) { return 404; }

    # Service API: host-local only (see header).
    location /api/ { return 403; }

    # Network sign-in and the account-data loopback are handled by the app; the app refuses the loopback path.
    location /auth/ {
        proxy_pass http://127.0.0.1:5230;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /mcp {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:5230;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /robots.txt { proxy_pass http://127.0.0.1:5230; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header CF-Connecting-IP $remote_addr; }
    location = /sitemap.xml { proxy_pass http://127.0.0.1:5230; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header CF-Connecting-IP $remote_addr; }
    location = /llms.txt { proxy_pass http://127.0.0.1:5230; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header CF-Connecting-IP $remote_addr; }
    location = /llms-full.txt { proxy_pass http://127.0.0.1:5230; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header CF-Connecting-IP $remote_addr; }
    location = /release.json { proxy_pass http://127.0.0.1:5230; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header CF-Connecting-IP $remote_addr; }
    location /shared/ { proxy_pass http://127.0.0.1:5230; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header CF-Connecting-IP $remote_addr; }

    location = / {
        proxy_pass http://127.0.0.1:5230;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
    }

    # Everything else: the app answers GET/HEAD (its /docs, /favicon.ico, and its own 404 page); other methods
    # are refused here.
    location / {
        limit_except GET HEAD { deny all; }
        proxy_pass http://127.0.0.1:5230;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
